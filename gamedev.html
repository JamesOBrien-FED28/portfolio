<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <link rel="icon" type="image/jpeg" href="./images/JamesX.jpeg">
    <title>James O'Brien - Game Dev</title>
</head>

<body>

    <a href="./index.html">
        <div class="title">
            <h1 class="typewriter"></h1>
        </div>
    </a>

    <div>
        <h2>Game Development</h2>
        <p>All games on this site are solo developed.<br>
            Polarity Evolved and Shooty Man are recommended to be played on a PC</p>
    </div>
    <div class="navigation">

        <div id="polarity" class="card">

            <a href="./games/polarityevolved/polarityevolved.html" target="_blank"
                onclick="window.open(this.href, 'UnityGameWindow', 'width=' + screen.availWidth + ',height=' + screen.availHeight + ',left=0,top=0,resizable=yes,scrollbars=no,toolbar=no,location=no,directories=no,status=no,menubar=no'); return false;"
                title="Polarity Evolved is a twin-stick 2D shooter game developed in Unity. Basic controls are shown on the title screen and further instructions can be found on the pause screen by pressing Start on your controller.">
                <img src="./images/polaritytitle.png" class="card-video"
                    alt="A screenshot of the Polarity Evolved title screen.">
                <div class="card-overlay">
                </div>
                <span class="card-title">Polarity Evolved (Unity)<br>Note: Requires Controller</span>
            </a>
        </div>

        <div id="shootyman" class="card">
            <a href="./games/shootyman/shootyman.html" target="_blank"
                onclick="window.open(this.href, 'UnityGameWindow', 'width=' + screen.availWidth + ',height=' + screen.availHeight + ',left=0,top=0,resizable=yes,scrollbars=no,toolbar=no,location=no,directories=no,status=no,menubar=no'); return false;"
                title="Shooty Man is a simple 2D platforming shoot-em-up game developed in vanilla Javascript. It was designed to have the look of a Commodore 64 game and uses the original font and color palette of the C64 system.">
                <img src="./images/shootymanscreen.png" class="card-video" alt="A screenshot of Shooty Man.">
                <div class="card-overlay"></div>
                <span class="card-title">Shooty Man (Vanilla JS)<br>Note: Requires Keyboard</span>
            </a>
        </div>

        <div id="dungeonofdread" class="card">
            <a href="./games/dungeonofdread/dungeonofdread.html" target="_blank"
                onclick="window.open(this.href, 'UnityGameWindow', 'width=' + screen.availWidth + ',height=' + screen.availHeight + ',left=0,top=0,resizable=yes,scrollbars=no,toolbar=no,location=no,directories=no,status=no,menubar=no'); return false;"
                title="This is a basic choose your own adventure game made using only HTML. It was made as part of the Hyper Island Frontend Developer program.">
                <img src="./games/dungeonofdread/images/01.png" class="card-video"
                    alt="The adventurer protagonist prepare to enter the Dungeon of Dread.">
                <div class="card-overlay"></div>
                <span class="card-title">Dungeon of Dread (HTML)<br>HTML Choose Your Own Adventure</span>
            </a>
        </div>
    </div>

</body>

</html>
